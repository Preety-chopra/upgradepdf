services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --queues=celery,ocr
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
      - db

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_beat
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: pdf_redis

  db:
    image: postgres:16-alpine
    container_name: pdf_db
    restart: always
    environment:
      POSTGRES_DB: pdf_platform
      POSTGRES_USER: pdf_user
      POSTGRES_PASSWORD: pdf_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  frontend_node_modules: