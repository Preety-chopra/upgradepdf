services:
  caddy:
    profiles:
      - production

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8011:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  worker:
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  beat:
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  frontend:
    image: fixmypdf-frontend-dev:latest
    build:
      target: frontend-development
    command: npm run dev
    environment:
      # Keep browser requests same-origin; Vite proxies them over Docker's network.
      VITE_API_BASE_URL: ""
      VITE_DEV_API_TARGET: http://api:8000
    ports: !override
      - "5175:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  db:
    ports:
      - "5434:5432"

volumes:
  frontend_node_modules:
