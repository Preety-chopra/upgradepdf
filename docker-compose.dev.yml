services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  worker:
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  beat:
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  frontend:
    build:
      target: frontend-development
    command: npm run dev
    ports: !override
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  db:
    ports:
      - "5433:5432"

volumes:
  frontend_node_modules:
